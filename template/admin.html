<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/style/style.css">
    <style>
        .error-msg { color: #d32f2f; margin-bottom: 16px; font-size: 14px; }
        .form-footer { margin-top: 20px; }
        .form-footer a { color: #5570f1; text-decoration: none; }
        .form-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Admin Login</h1>
            <div id="errorBox" class="error-msg"></div>
            <form action="/admin/login" method="POST">
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
            <p class="form-footer"><a href="/">← Back to Home</a></p>
        </div>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'invalid') {
            document.getElementById('errorBox').textContent = 'Invalid username or password.';
        }
    </script>
</body>
</html>
