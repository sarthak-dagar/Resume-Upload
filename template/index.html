<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your Resume</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Upload Your Resume</h1>
            <form id="resumeForm" action="/upload" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp Number (Optional)</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="+91 92113 00850">
                </div>

                <div class="form-group">
                    <label for="resume">Resume (PDF/DOC/DOCX) <span class="required">*</span></label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                </div>

                <button type="submit" class="submit-btn">Submit Resume</button>
            </form>
            <div id="successMsg" class="success-msg" style="display: none;">
                <p class="success-text">✓ Your resume is submitted.</p>
                <p class="success-name">Thank you, <span id="successName"></span>. We'll contact you soon.</p>
            </div>
            <div id="errorMsg" class="error-msg-box" style="display: none;">
                <p>File too large. Maximum size is 15 MB. Please choose a smaller file.</p>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('success') === '1') {
                var msg = document.getElementById('successMsg');
                var nameEl = document.getElementById('successName');
                if (msg && nameEl) {
                    nameEl.textContent = params.get('name') || '';
                    msg.style.display = 'block';
                }
            }
            if (params.get('error') === 'filesize') {
                var err = document.getElementById('errorMsg');
                if (err) err.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
